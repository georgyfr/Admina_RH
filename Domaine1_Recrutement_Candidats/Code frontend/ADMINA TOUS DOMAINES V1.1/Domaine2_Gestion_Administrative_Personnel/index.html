function arcPath(cx, cy, r, a0, a1){
  function p(a){ return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; }

function renderDonut(host, sel){

/* ---------- barres mensuelles ---------- */
function monthsOf(sel){
  var keys = {};
  sel.forEach(function(x){

    var d2 = pd(x.datePourvue); if (d2) keys[keyOf(d2)] = 1;

function renderBars(host, sel){

var BANNER_T = null;
function topBanner(msg){
  ensureCSS();
  var b = D.getElementById('adem8-banner');
  if (!b){
    b = D.createElement('div');
    b.id = 'adem8-banner';
    b.setAttribute('role', 'status');

    b.innerHTML = '<span class="adem8-msg"></span><button type="button" aria-label="Fermer la notification">\u2715</button>';
    D.body.appendChild(b);
    b.querySelector('button').addEventListener('click', function(){ hideBanner(); });
  }
  b.querySelector('.adem8-msg').textContent = msg;
  b.classList.add('on');

  BANNER_T = setTimeout(hideBanner, 6500);

  var b = D.getElementById('adem8-banner');
  if (b) b.classList.remove('on');
}

/* ================= BROUILLONS / DERNIÈRE DEMANDE ================= */
function drafts(){ try { return JSON.parse(lsGet('adem8_drafts') || '[]'); } catch(e){ return []; } }
function saveDrafts(a){ lsSet('adem8_drafts', JSON.stringify(a.slice(0, 5))); }
function addDraft(vals){
  var a = drafts();
  a.unshift({ id: Date.now(), savedAt: new Date().toISOString(), mode: S.mode, source: S.num, values: vals });
  saveDrafts(a);
}
function delDraft(id){
  saveDrafts(drafts().filter(function(d){ return String(d.id) !== String(id); }));
}
function saveLast(vals, numero){
  lsSet('adem8_last', JSON.stringify({
    numero: numero, at: new Date().toISOString(),
    dept: vals.dept, typeContrat: vals.typeContrat, site: vals.site,
    cabinet: vals.cabinet, resp: vals.resp, role: vals.role, motif: vals.motif
  }));
}

/* ================= VALIDATION ================= */
function validate(v){
  var errs = {};
  REQUIRED.forEach(function(k){ if (v[k] === '' || v[k] == null) errs[k] = 'Champ obligatoire'; });
  if (v.dateBesoin){
    var db = parseFR(v.dateBesoin);
    if (!db) errs.dateBesoin = 'Format de date invalide (jj/mm/aaaa)';
    else {
      var t = new Date(); t.setHours(0, 0, 0, 0);
      if (db < t) errs.dateBesoin = 'La date de besoin ne peut pas être antérieure à la date du jour';
    }
  }
  if (v.budget !== '' && v.budget != null && !(Number(v.budget) > 0)) errs.budget = 'Le budget salaire doit être un nombre positif';
  if (v.cout !== '' && v.cout != null && !(Number(v.cout) >= 0)) errs.cout = 'Le coût doit être un nombre positif';
  if (v.effectif !== '' && v.effectif != null){
    var e = Number(v.effectif);
    if (!isFinite(e) || !Number.isInteger(e) || e < 1) errs.effectif = "L'effectif doit être un entier positif (minimum 1)";
  }
  if (v.delai !== '' && v.delai != null && !(Number(v.delai) >= 0)) errs.delai = 'Le délai doit être positif';
  return errs;
}

/* ================= RENDU ================= */
function fieldHTML(f){
  var id = 'adem8-f-' + f.k;
  var lab = '<label for="' + id + '">' + esc(f.label) + (f.req ? '<span class="rq" aria-hidden="true">*</span>' : '') + '</label>';
  var ctl;
  if (f.type === 'select'){
    ctl = '<select id="' + id + '" name="' + f.k + '"' + (f.req ? ' aria-required="true"' : '') + '><option value="">— Sélectionner —</option></select>';
  } else if (f.type === 'textarea'){
    ctl = '<textarea id="' + id + '" name="' + f.k + '" rows="3" placeholder="' + esc(f.ph || '') + '"' + (f.req ? ' aria-required="true"' : '') + '></textarea>';
  } else if (f.type === 'prio'){
    ctl = '<div class="adem8-pills" role="radiogroup" aria-label="Priorité" id="' + id + '">' + PRIO.map(function(p){
      return '<label class="adem8-pill"><input type="radio" name="adem8-prio" value="' + p.v + '"' + (f.req ? ' aria-required="true"' : '') + '>' +
        '<span style="background:' + (p.v === 'Basse' ? '' : p.c) + '" data-pc="' + p.c + '">' + p.e + ' ' + p.v + '</span></label>';
    }).join('') + '</div>';
  } else {
    var extra = f.type === 'number' ? ' min="' + (f.min || 0) + '" step="1" inputmode="numeric"' : '';
    var dl = f.list ? ' list="adem8-dl-' + f.list + '"' : '';
    ctl = '<input id="' + id + '" name="' + f.k + '" type="' + (f.type === 'date' ? 'date' : f.type) + '"' + extra + dl +
          ' placeholder="' + esc(f.ph || '') + '"' + (f.req ? ' aria-required="true"' : '') + '>';
  }
  var hint = f.hint ? '<div class="adem8-hint" id="adem8-hint-' + f.k + '">' + esc(f.hint) + '</div>' : '';
  var cab = f.k === 'cabinet' ? '<div class="adem8-cabhint" id="adem8-cabhint"><span class="adem8-cabtxt"></span><button type="button" id="adem8-cabuse">Utiliser</button></div>' : '';
  return '<div class="adem8-field' + (f.full ? ' adem8-full' : '') + '" data-k="' + f.k + '">' + lab + ctl + hint + cab +
         '<div class="adem8-err" role="alert" data-for="' + f.k + '"></div></div>';
}

/* ================= BANNIÈRES (brouillons + dernière demande) ================= */
function renderBanners(){
  var z = $('#adem8-banners', S.panel);
  if (!z) return;
  z.innerHTML = '';
  var drs = drafts();
  drs.forEach(function(d){
    var when = new Date(d.savedAt);
    var lab = ('0' + when.getDate()).slice(-2) + '/' + ('0' + (when.getMonth() + 1)).slice(-2) + '/' + when.getFullYear() + ' ' +
              ('0' + when.getHours()).slice(-2) + ':' + ('0' + when.getMinutes()).slice(-2);
    var what = d.values && (d.values.poste || d.values.dept) ? esc(d.values.poste || '') + (d.values.dept ? ' — ' + esc(d.values.dept) : '') : 'formulaire partiel';
    var row = D.createElement('div');
    row.className = 'adem8-bn dr adem8-draft-row';
    row.innerHTML = '<span>\uD83D\uDCC4</span><span class="grow"><b>Brouillon du ' + lab + '</b> — ' + what + '</span>' +
      '<button type="button" class="use adem8-draft-use" data-id="' + esc(d.id) + '">Reprendre</button>' +
      '<button type="button" class="del adem8-draft-del" data-id="' + esc(d.id) + '" aria-label="Supprimer ce brouillon">Supprimer</button>';
    z.appendChild(row);
  });
  var lastRaw = lsGet('adem8_last');
  if (lastRaw && S.mode === 'new' && !S.resuming){
    try {
      var last = JSON.parse(lastRaw);
      if (last && last.numero && last.numero !== skipNum()){
        var bn = D.createElement('div');
        bn.className = 'adem8-bn lt';
        bn.id = 'adem8-lastbanner';
        bn.innerHTML = '<span>\u267B\uFE0F</span><span class="grow">Pré-remplir depuis votre dernière demande (<b>' + esc(last.numero) + '</b>) : département, contrat, site, cabinet…</span>' +
          '<button type="button" class="use" id="adem8-lastuse">Pré-remplir</button>' +
          '<button type="button" class="skip" id="adem8-lastskip">Ignorer</button>';
        z.appendChild(bn);
      }
    } catch(e){}
  }
  $$('.adem8-draft-use', z).forEach(function(b){
    b.addEventListener('click', function(){
      var d = drafts().find(function(x){ return String(x.id) === b.getAttribute('data-id'); });
      if (!d) return;
      S.resuming = d.id;
      Object.keys(S.values).forEach(function(k){ S.values[k] = ''; });
      Object.keys(d.values || {}).forEach(function(k){ if (k in S.values) S.values[k] = d.values[k]; });
      fillFormValues();
      renderBanners();
      if (v7()) v7()._toast('Brouillon repris — complétez puis « Soumettre \u00E0 validation »');
    });
  });
  $$('.adem8-draft-del', z).forEach(function(b){
    b.addEventListener('click', function(){ delDraft(b.getAttribute('data-id')); renderBanners(); });
  });
  var lu = $('#adem8-lastuse', z);
  if (lu) lu.addEventListener('click', function(){
    try {
      var last = JSON.parse(lsGet('adem8_last') || '{}');
      ['dept', 'typeContrat', 'site', 'cabinet', 'resp', 'role', 'motif'].forEach(function(k){
        if (last[k] && !S.values[k]) S.values[k] = last[k];
      });
      fillFormValues();
      if (last.numero){ try { sessionStorage.setItem('adem8_lastskip', last.numero); } catch(e){} }
      bnHide(z);
      if (v7()) v7()._toast('Champs pré-remplis depuis ' + (last.numero || 'votre dernière demande'));
    } catch(e){}
  });
  var ls = $('#adem8-lastskip', z);
  if (ls) ls.addEventListener('click', function(){
    try {
      var last2 = JSON.parse(lsGet('adem8_last') || '{}');
      if (last2.numero) sessionStorage.setItem('adem8_lastskip', last2.numero);
    } catch(e){}
    bnHide(z);
  });
  function bnHide(z){ var b = $('#adem8-lastbanner', z); if (b) b.remove(); }
}
function skipNum(){
  try { return sessionStorage.getItem('adem8_lastskip'); } catch(e){ return null; }
}

/* ================= FORM ↔ STATE ================= */
function readFormValues(){
  var v = {};
  FIELDS.forEach(function(f){
    var el = $('#adem8-f-' + f.k, S.panel);
    if (!el) return;
    if (f.type === 'prio'){
      var r = $('.adem8-pill input:checked', S.panel);
      v[f.k] = r ? r.value : '';
    } else if (f.type === 'date'){
      v[f.k] = iso2fr(el.value); /* stocké en jj/mm/aaaa (format natif de l'app) */
    } else {
      v[f.k] = el.value;
    }
  });
  return v;
}
function fillFormValues(){
  FIELDS.forEach(function(f){
    var el = $('#adem8-f-' + f.k, S.panel);
    if (!el) return;
    var val = S.values[f.k] || '';
    if (f.type === 'prio'){
      var r = $('.adem8-pill input[value="' + val.replace(/"/g, '\\"') + '"]', S.panel);
      if (r){ r.checked = true; r.dispatchEvent(new Event('change', { bubbles: true })); }
    } else if (f.type === 'date'){
      el.value = fr2iso(val);
    } else if (el.tagName === 'SELECT'){
      ensureOption(el, val);
      el.value = val;
    } else {
      el.value = val;
    }
  });
  refreshCabinetHint(); refreshDelaiHint();
}
function ensureOption(sel, val){
  if (!val) return;
  var has = Array.prototype.some.call(sel.options, function(o){ return o.value === val; });
  if (!has){
    var op = D.createElement('option');
    op.value = val; op.textContent = val;
    sel.appendChild(op);
  }
}
function markDirty(){ S.dirty = true; }

/* ================= HINTS DYNAMIQUES ================= */
function refreshDelaiHint(){
  var h = $('#adem8-hint-delai', S.panel);
  if (!h) return;
  var el = $('#adem8-f-dateBesoin', S.panel);
  var raw = el ? (iso2fr(el.value) || S.values.dateBesoin) : S.values.dateBesoin;
  var db = parseFR(raw);
  if (db){
    var t = new Date(); t.setHours(0, 0, 0, 0);

/* ================= SYNC NATIF (technique validée recon_form_v8.py) ================= */
function findND(){
  return $$('button').find(function(b){
    return (b.textContent || '').trim().toLowerCase().indexOf('nouvelle demande') === 0;
  }) || null;
}
function findNativeDialog(){
  return $$('.MuiDialog-root').find(function(d){
    if (d.getAttribute('aria-hidden') === 'true') return false;
    return d.querySelector('input, select, textarea') != null;
  }) || null;
}
function fiberOnChange(el){
  var k = Object.keys(el).find(function(x){ return x.indexOf('__reactFiber$') === 0; });
  if (!k) return null;
  var f = el[k], hops = 0;
  while (f && hops < 12){
    var p = f.memoizedProps;
    if (p && typeof p.onChange === 'function' && ('value' in p)) return p.onChange;
    f = f.return; hops++;
  }
  return null;
}
function setNativeValue(el, val){
  var proto = el.tagName === 'TEXTAREA' ? window.HTMLTextAreaElement.prototype : window.HTMLInputElement.prototype;
  var d = Object.getOwnPropertyDescriptor(proto, 'value');
  if (d && d.set) d.set.call(el, String(val)); else el.value = String(val);
  el.dispatchEvent(new Event('input', { bubbles: true }));
  el.dispatchEvent(new Event('change', { bubbles: true }));
}
function findFC(dlg, label){
  var fcs = $$('.MuiFormControl-root', dlg);
  return fcs.find(function(fc){
    var lab = fc.querySelector('.MuiFormLabel-root, label');
    return lab && lab.textContent.trim().replace(/\s*\*\s*$/, '').indexOf(label) === 0;
  }) || null;
}
/* Ouvre le dialog natif, synchronise les champs, clique Enregistrer, attend la fermeture. */
function nativeSync(vals, cb){
  var nd = findND();
  if (!nd){ cb(new Error('bouton Nouvelle Demande introuvable')); return; }
  nd.click(); /* programmatique : isTrusted=false → PAS intercepté par V8 */
  var tries = 0, t = setInterval(function(){
    tries++;
    var dlg = findNativeDialog();
    if (!dlg && tries < 60) return;
    clearInterval(t);
    if (!dlg){ cb(new Error('dialog natif non ouvert')); return; }
    var keys = Object.keys(vals).filter(function(k){ return vals[k] !== '' && vals[k] != null; });
    var i = 0;
    function step(){
      if (i >= keys.length) return finish();
      var label = keys[i++];
      var fc = findFC(dlg, label);
      if (!fc) return setTimeout(step, 10);
      var sel = fc.querySelector('.MuiSelect-select');
      if (sel){
        var oc = fiberOnChange(sel);
        if (oc){ try { oc({ target: { value: String(vals[label]) } }); } catch(e){} }
        setTimeout(step, 35); /* laisse React re-rendre */
      } else {
        var inp = fc.querySelector('input:not([aria-hidden])') || fc.querySelector('textarea');
        if (inp) setNativeValue(inp, vals[label]);
        step();
      }
    }
    function finish(){
      var n = 0, t2 = setInterval(function(){
        n++;
        var b = $$('button', dlg).find(function(x){ return x.textContent.trim() === 'Enregistrer'; });
        if (b && !b.disabled){ clearInterval(t2); b.click(); afterClick(); return; }
        if (n > 25){ clearInterval(t2); cb(new Error('Enregistrer toujours désactivé')); }
      }, 120);
    }
    function afterClick(){
      var m = 0, t3 = setInterval(function(){
        m++;
        if (!findNativeDialog()){ clearInterval(t3); cb(null); return; }
        if (m > 26){ clearInterval(t3); cb(new Error('dialog natif non fermé après enregistrement')); }
      }, 160);
    }
    step();
  }, 80);
}

/* ================= NAVIGATION PAGINATION + SURLIGNAGE ================= */
function gotoLastPageThen(num, poste){

  var rows = $$('table tbody tr').filter(function(tr){ return !tr.classList.contains('adem2-hide') && tr.style.display !== 'none'; });
  var tr = null;
  if (num) tr = rows.find(function(r){ return (r.textContent || '').indexOf(num) >= 0; });
  if (!tr && poste) tr = rows.find(function(r){ return (r.textContent || '').indexOf(poste) >= 0; });

/* ================= ACTIONS ================= */
function showErrors(errs){
  S.errs = errs;
  $$('.adem8-field', S.panel).forEach(function(fd){
    var k = fd.getAttribute('data-k');

    if (e) e.textContent = bad ? errs[k] : '';

      if (bad) ctl.setAttribute('aria-invalid', 'true'); else ctl.removeAttribute('aria-invalid');
    }
  });
}
function submitFlow(){
  S.values = readFormValues();
  var errs = validate(S.values);
  showErrors(errs);
  S.attempted = true;
  var keys = Object.keys(errs);
  if (keys.length){
    var first = $('#adem8-f-' + keys[0], S.panel);
    if (first) first.focus();
    if (v7()) v7()._toast('\u274C ' + keys.length + ' champ(s) à corriger avant de soumettre');
    return;
  }
  var numero = nextNumero();
  var btn = $('#adem8-submit', S.panel);
  if (btn){ btn.disabled = true; btn.textContent = 'Enregistrement\u2026'; }
  var vals = {};
  Object.keys(NATIVE_LABEL).forEach(function(k){
    vals[NATIVE_LABEL[k]] = S.values[k] || '';
  });
  nativeSync(vals, function(err){
    if (btn){ btn.disabled = false; btn.textContent = 'Soumettre \u00E0 validation'; }
    if (err){
      if (v7()) v7()._toast('\u274C Enregistrement impossible : ' + err.message);
      return;
    }
    S.adds.push({
      row: {
        num: numero, date: todayFR(), dept: S.values.dept, poste: S.values.poste,
        typePoste: S.values.typePoste, typeContrat: S.values.typeContrat,
        prio: S.values.priorite, statut: 'En attente', datePourvue: '',
        resp: S.values.resp, cabinet: S.values.cabinet,
        budget: Number(S.values.budget) || 0, cout: Number(S.values.cout) || 0,
        delai: Number(S.values.delai) || 0, notes: S.values.notes,
        site: S.values.site, effectif: Number(S.values.effectif) || 1,
        motif: S.values.motif, dateBesoin: S.values.dateBesoin, role: S.values.role
      },
      draftId: S.resuming
    });
    if (S.resuming){ delDraft(S.resuming); S.resuming = null; }
    saveLast(S.values, numero);
    try { sessionStorage.setItem('adem8_lastskip', numero); } catch(e){}
    var poste = S.values.poste;
    hardClose();
    /* note : la demande réelle vit désormais dans l'état React natif (row ajoutée par l'app) */
    topBanner('\u2705 Demande ' + numero + ' soumise \u00E0 validation — statut « En attente ». Elle apparaît en fin de tableau.');
    gotoLastPageThen(numero, poste);
    try { document.dispatchEvent(new CustomEvent('adem8:submitted', { detail: { numero: numero } })); } catch(e){}

function draftFlow(){

function cancelFlow(){

/* ================= OUVERTURE / FERMETURE ================= */
function open(opts){
  opts = opts || {};

  if (!isDemandes()) return;

      if (d){
        S.values = {
          dept: d.dept || '', resp: d.resp || '', role: d.role || '', site: d.site || '',

          ' — vérifiez chaque champ, puis soumettez. Une <b>nouvelle</b> demande (N° automatique) sera créée.';
      }

    renderBanners();
    wire();

function wire(){
  if (!S.panel) return;
  FIELDS.forEach(function(f){
    var el = $('#adem8-f-' + f.k, S.panel);
    if (!el) return;
    var h = function(){
      S.values = readFormValues();
      markDirty();
      if (S.attempted) showErrors(validate(S.values));
      if (f.k === 'dateBesoin'){
        if (!S.delaiTouched){
          var db = parseFR(iso2fr(el.value));
          if (db){
            var t = new Date(); t.setHours(0, 0, 0, 0);
            var d = Math.max(0, diffDays(db, t));

        }
        refreshDelaiHint();
      }
      if (f.k === 'dept' || f.k === 'typePoste') refreshCabinetHint();

      if (f.k === 'resp'){
        var r = roleFor(S.values.resp);
        if (r && !S.values.role){
          S.values.role = r;
          var rs = $('#adem8-f-role', S.panel);
          ensureOption(rs, r); rs.value = r;
          var hint = $('#adem8-hint-role', S.panel);

        }

    };
    el.addEventListener('input', h);
    el.addEventListener('change', h);
  });
  var close = $('#adem8-close', S.panel);
  if (close) close.addEventListener('click', cancelFlow);
  var cancel = $('#adem8-cancel', S.panel);
  if (cancel) cancel.addEventListener('click', cancelFlow);
  var draft = $('#adem8-draft', S.panel);
  if (draft) draft.addEventListener('click', draftFlow);
  var sub = $('#adem8-submit', S.panel);
  if (sub) sub.addEventListener('click', submitFlow);
  var quit = $('#adem8-quit', S.panel);
  if (quit) quit.addEventListener('click', function(){ S.dirty = false; hardClose(); });
  var cont = $('#adem8-continue', S.panel);
  if (cont) cont.addEventListener('click', function(){ var c = $('#adem8-confirm', S.panel); if (c) c.classList.remove('on'); });
  var cab = $('#adem8-cabuse', S.panel);
  if (cab) cab.addEventListener('click', function(){
    var sg = cabinetSuggestion(S.values);
    if (!sg) return;
    var sel = $('#adem8-f-cabinet', S.panel);
    ensureOption(sel, sg.cabinet);
    sel.value = sg.cabinet;
    S.values.cabinet = sg.cabinet;
    markDirty();
    refreshCabinetHint();
  });
  S.panel.addEventListener('keydown', function(e){
    if (e.key === 'Escape'){ e.stopPropagation(); cancelFlow(); return; }
    if (e.key === 'Tab'){
      var foc = $$('button, input, select, textarea, [tabindex]:not([tabindex="-1"])', S.panel)
        .filter(function(x){ return !x.disabled && x.offsetParent !== null; });
      if (!foc.length) return;
      var first = foc[0], last = foc[foc.length - 1];
      if (e.shiftKey && D.activeElement === first){ e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && D.activeElement === last){ e.preventDefault(); first.focus(); }
    }
  });
  var ov = $('#adem8-overlay');
  if (ov) ov.addEventListener('mousedown', function(e){ if (e.target === ov) cancelFlow(); });
}
function hardClose(){
  if (S.panel){ S.panel.remove(); S.panel = null; }
  var ov = $('#adem8-overlay');
  if (ov) ov.remove();
  var prev = D.body.getAttribute('data-adem8-ov');
  D.body.style.overflow = prev || '';
  D.body.removeAttribute('data-adem8-ov');
  S.open = false; S.dirty = false; S.attempted = false; S.resuming = null;
  var nd = findND();
  if (nd){ try { nd.focus(); } catch(e){} }
}

/* ================= INTERCEPTION DU CLIC UTILISATEUR ================= */
D.addEventListener('click', function(e){

<script>
/* ============================================================
   ADEM_V9 — Étape 4 : Délais de traitement 30/45 j + Non-Conformités
   - Colonne « Délai » avec pastilles (Conforme ≤30 j / Vigilance 31-45 j / Critique >45 j)

/* ---------- colonne « Délai » + drapeaux 🚩 ---------- */
function pillHTML(rec){
  var k = cls(rec);
  var n = delai(rec);
  var lab = k === 'na' ? '—' : n + ' j';
  var tips = {
    ok: 'Délai de traitement : ' + n + ' jours — conforme (cible ≤ 30 j)',
    vig: 'Délai de traitement : ' + n + ' jours — vigilance (31-45 j, cible ISO < 45 j)',
    crit: 'Délai de traitement : ' + n + ' jours — CRITIQUE, dépasse la cible ISO de 45 j',
    na: 'Délai non applicable'
  };
  var ncs = ncFor(rec.num).filter(function(x){ return x.statut !== 'Clôturée'; }).length;
  var flag = ncs ? ' <span class="adem9-flagc" title="' + ncs + ' non-conformité(s) ouverte(s)">🚩×' + ncs + '</span>' : '';
  return '<span class="adem9-del ' + k + '" title="' + esc(tips[k]) + '">' + lab + flag + '</span>';
}
function rowData(tr){
  var m = (tr.textContent || '').match(/DR-\d{4}-\d{3}/);
  if (!m) return null;
  var rec = data().filter(function(x){ return x.num === m[0]; })[0];
  return rec ? { num: m[0], data: rec } : { num: m[0], data: null };
}
function syncTable(){
  if (!isDemandes()) return;
  var tbl = $('.MuiTableContainer-root table');
  if (!tbl) return;
  /* en-tête : insérer « Délai » juste après « Statut » (garde Actions visible) */
  var ths = $$('thead th', tbl);
  if (ths.length && !$('#adem9-th-delai', tbl)){
    var th = D.createElement('th');
    th.id = 'adem9-th-delai';
    th.textContent = 'Délai';
    th.setAttribute('style', 'font-weight:800 !important;font-size:13px !important;text-transform:uppercase;letter-spacing:.3px;');
    var statutTh = ths.filter(function(x){ return (x.textContent || '').trim() === 'Statut'; })[0] || ths[ths.length - 2] || ths[0];
    statutTh.parentNode.insertBefore(th, statutTh.nextSibling);
  }
  /* index de la colonne Statut (pour insérer le td au même rang) */
  var ths2 = $$('thead th', tbl);
  var statutIdx = -1;
  ths2.forEach(function(x, i){ if ((x.textContent || '').trim() === 'Statut') statutIdx = i; });
  /* lignes : td délai + drapeau 🚩 */
  $$('tbody tr', tbl).forEach(function(tr){
    var rd = rowData(tr);
    if (!rd) return;
    var lastTd = tr.querySelector('td:last-child');
    if (!lastTd) return;
    if (!$('.adem9-td', tr)){
      var td = D.createElement('td');
      td.className = 'adem9-td';
      td.setAttribute('data-l', 'Délai');
      td.innerHTML = pillHTML(rd.data);
      var tds = tr.querySelectorAll('td');
      var ref = (statutIdx > -1 && tds[statutIdx]) ? tds[statutIdx].nextSibling : lastTd;
      ref.parentNode.insertBefore(td, ref);
    } else {
      /* refresh systématique léger (évite divergences après ajout NC) */
      var td2 = $('.adem9-td', tr);
      var fresh = pillHTML(rd.data);
      if (td2.innerHTML !== fresh) td2.innerHTML = fresh;
    }
    /* 🚩 dans les actions V7 (ou colonne actions seule) */
    var acts = tr.querySelector('.adem7-acts') || tr.querySelector('.adem9-acts');
    if (lastTd && !$('.adem9-flag', tr)){
      var b = D.createElement('button');
      b.type = 'button';
      b.className = 'adem7-ico adem9-flag';
      b.textContent = '🚩';
      b.setAttribute('aria-label', 'Déclarer une non-conformité pour ' + rd.num);
      b.title = 'Déclarer une non-conformité';
      b.addEventListener('click', function(ev){ ev.stopPropagation(); openNC(rd.num); });
      if (acts) acts.appendChild(b);
      else if (lastTd){
        var wrap = D.createElement('div');
        wrap.className = 'adem9-acts';
        wrap.style.cssText = 'display:inline-flex;gap:2px;';
        wrap.appendChild(b);
        lastTd.appendChild(wrap);
      }
    }
  });
}

/* ---------- filtre « Délai » (greffé sur la barre V2) ---------- */
var ST9 = '';
function interCount(){
  var d = data();
  var vis = v2() ? v2().visibleNums() : null;
  var n = 0;
  d.forEach(function(x){
    if (ST9 && cls(x) !== ST9) return;
    if (vis && vis.size < d.length && !vis.has(x.num)) return;
    n++;
  });
  return n;
}
function restoreCounters(){
  var d = data();
  var vis = v2() ? v2().visibleNums() : null;
  var n = vis ? vis.size : d.length;
  var xy = $('#adem2-bar .adem2-x-y');
  if (xy) xy.textContent = n + '/' + d.length;
  var nb = $('#adem-charts-panel .adem5-nb');
  if (nb) nb.textContent = String(n);
}
function applyHide(){
  var d = data();
  var vis = v2() ? v2().visibleNums() : null;
  var tbl = $('.MuiTableContainer-root table');
  if (!tbl) return;
  var total = d.length;
  $$('tbody tr', tbl).forEach(function(tr){
    var rd = rowData(tr);
    var hide = false;
    if (rd){
      var rec = rd.data;
      if (ST9 && (!rec || cls(rec) !== ST9)) hide = true;
      if (vis && vis.size < total && rec && !vis.has(rec.num)) hide = true;
      if (vis && vis.size < total && !rec) hide = true;
    }
    tr.classList.toggle('adem9-hide', hide);
  });
  /* compteur x/y de la barre V2 reflet de l'intersection quand le filtre délai est actif */
  if (ST9){
    var xy = $('#adem2-bar .adem2-x-y');
    if (xy) xy.textContent = interCount() + '/' + total;
    var nb = $('#adem-charts-panel .adem5-nb');
    if (nb) nb.textContent = String(interCount());
  }
}
function wireFilterEvents(){
  D.addEventListener('adem2:change', function(){
    setTimeout(function(){
      /* V2.syncControls remet tous les .adem2-sel à ST[k] — restaurer notre valeur */
      var sel = $('#adem9-fdelai');
      if (sel && sel.value !== ST9) sel.value = ST9;
      applyHide();
    }, 40);
  });
}
function buildSelect(){
  var bar = $('#adem2-bar');
  if (!bar || $('#adem9-fdelai')) return;
  var opts = ['<option value="">Tous les délais</option>',
    '<option value="ok">Conforme ≤ 30 j</option>',
    '<option value="vig">Vigilance 31-45 j</option>',
    '<option value="crit">Critique &gt; 45 j</option>'].join('');
  var sel = D.createElement('select');
  sel.id = 'adem9-fdelai';
  sel.className = 'adem2-sel';
  sel.setAttribute('data-k', 'delai9');
  sel.setAttribute('aria-label', 'Filtrer par délai de traitement');
  sel.innerHTML = opts;
  var row = bar.querySelector('.adem2-row');
  var lastSel = $$('.adem2-sel', bar).pop() || row.lastChild;
  if (row && lastSel) row.insertBefore(sel, lastSel.nextSibling);
  else if (row) row.appendChild(sel);
  else bar.appendChild(sel);
  sel.addEventListener('change', function(){
    ST9 = sel.value;
    sel.classList.toggle('adem2-on', !!ST9);
    applyHide();
    if (!ST9) restoreCounters();
  });
  /* réinitialisation : le bouton V2 remonte aussi notre filtre */
  var reset = bar.querySelector('.adem2-reset');
  if (reset) reset.addEventListener('click', function(){
    ST9 = '';
    sel.value = '';
    sel.classList.remove('adem2-on');
  }, true);
}

<script>
/* ADEM_V10 — Correctif sidebar : chevauchement du sélecteur « Autres Domaines » (#admina-cdn)
 * CAUSE (script inline tiers de index.html) : #admina-cdn est appendu dans .MuiDrawer-paper
 * avec position:sticky;bottom:0 et fond TRANSLUCIDE rgba(0,0,0,0.25). Or le paper est
 * LUI-MÊME le conteneur scrollable (contenu ~1800px > viewport) : l'élément sticky se
 * plaque en bas de l'écran PAR-DESSUS les derniers items du menu (Types de Contrats,
 * Départements, Planning Entretiens, Grille Évaluation…) → texte en double illisible et
 * liens inaccessibles. Constaté sur toutes les routes (D1, D2, D3), même sans modules ADEM.
 *
 * CORRECTIF 100% RUNTIME — aucun octet des scripts tiers modifié, aucun nœud React déplacé :
 *  1. #admina-cdn (élément vanilla du tiers, NON géré par React) passe en position:fixed
 *     bottom:0,left:0, largeur calée sur le paper → toujours visible, ne quitte jamais l'écran
 *  2. padding-bottom sur le paper = hauteur du sélecteur → la navigation peut défiler
 *     AU-DESSUS de l'overlay : AUCUN item jamais recouvert, tout est cliquable
 *  3. Fond rendu OPAQUE en compositant leur voile noir 25% sur le fond réel du paper
 *     (rendu visuel identique à leur intention, sans transparence du texte sous-jacent)
 *  4. Suivi ResizeObserver (largeur/hauteur paper + cdn) + MutationObserver/ré-application
 *     au re-mont React du drawer (SPA, changement de route, drawer temporaire mobile)
 *  5. Cible UNIQUEMENT le paper contenant directement #admina-cdn — jamais les autres
 *     drawers (registre NC V9, drawer détail natif). Masqué automatiquement avec le drawer
 *     (enfant du paper) → compatible V7 ≤820px (sidebar dockée masquée).
 * S'applique à toutes les routes (Domaines 1/2/3) — zéro impact métier.
 */
(function(){
'use strict';
if (window.__ADEM_V10__) return;
var D = document;

var done = new WeakSet();     /* papers déjà instrumentés */
var ro = null;
var mo = null;
var timer = null;

function ensureCSS(){
  if (D.getElementById('adem10-style')) return;
  var st = D.createElement('style');
  st.id = 'adem10-style';
  st.textContent =
    /* Overlay épinglé : remplace leur sticky (qui chevauchait la nav). !important car le
     * tiers définit position:sticky et une @media ≤600 position:static sur #admina-cdn. */
    '#admina-cdn{position:fixed!important;top:auto!important;bottom:0!important;left:0!important;right:auto!important;' +
    'z-index:1150!important;margin:0!important;border-radius:0!important;box-shadow:0 -6px 18px rgba(0,0,0,.22)!important;}';
  D.head.appendChild(st);
}

/* Fond réel du paper (alpha composé si nécessaire) puis voile noir 25% = leur design, en opaque */
function opaqueBg(paper){
  function rgbOf(s){
    var m = /rgba?\(\s*([\d.]+)[,\s]+([\d.]+)[,\s]+([\d.]+)(?:[,\s/]+([\d.]+))?/.exec(s || '');
    return m ? {r:+m[1], g:+m[2], b:+m[3], a:m[4]===undefined?1:+m[4]} : null;
  }
  var c = rgbOf(getComputedStyle(paper).backgroundColor);
  if (!c) return null;
  if (c.a < 1){
    var b = rgbOf(getComputedStyle(D.body).backgroundColor) || {r:255,g:255,b:255};
    c = {r:Math.round(c.r*c.a + b.r*(1-c.a)),
         g:Math.round(c.g*c.a + b.g*(1-c.a)),
         b:Math.round(c.b*c.a + b.b*(1-c.a)), a:1};
  }
  var k = 0.25; /* leur rgba(0,0,0,0.25) */
  return 'rgb(' + Math.round(c.r*(1-k)) + ',' + Math.round(c.g*(1-k)) + ',' + Math.round(c.b*(1-k)) + ')';
}

function apply(paper, cdn){
  try{
    var rect = paper.getBoundingClientRect();
    if (rect.width > 0) cdn.style.width = rect.width + 'px';
    var bg = opaqueBg(paper);
    if (bg) cdn.style.backgroundColor = bg;
    var h = cdn.offsetHeight;
    if (h > 0){
      /* Deux géométries selon le type de drawer :
       * - DOCKÉ (transform:none) : on RÉDUIT la hauteur du paper de h px → sa zone
       *   scrollable s'arrête exactement au-dessus de l'overlay (fixe, ancré viewport
       *   car paper non transformé) → AUCUN item jamais recouvert, à aucun scroll.
       *   (l'overlay fixed échappe au clipping overflow:auto du paper : son containing
       *   block est le viewport, pas le paper)
       * - TEMPORAIRE (paper transformé = containing block de l'overlay) : l'overlay ne
       *   peut pas sortir du paper (il serait clippé) → mode barre bas standard :
       *   padding-bottom = h sur le paper, contenu défilant au-dessus de l'overlay. */
      var transformed = false;
      try{ transformed = getComputedStyle(paper).transform !== 'none'; }catch(e){}
      if (!transformed){
        var target = Math.max(120, window.innerHeight - h) + 'px';
        if (paper.style.height !== target){
          paper.style.height = target;
        }
        if (paper.style.paddingBottom) paper.style.paddingBottom = '';
      } else {
        if (paper.style.height) paper.style.height = '';
        var pad = h + 'px';
        if (paper.style.paddingBottom !== pad) paper.style.paddingBottom = pad;
      }
    }
    /* leur bord haut doit rester visible sur l'overlay */
    cdn.style.borderTop = '1px solid rgba(255,255,255,0.12)';
  }catch(e){}
}

function fix(){
  var cdn = D.getElementById('admina-cdn');
  if (!cdn || !cdn.isConnected) return;
  var paper = cdn.parentElement;
  if (!paper || !paper.classList || !paper.classList.contains('MuiDrawer-paper')) return;
  ensureCSS();
  if (!done.has(paper)){
    done.add(paper);
    try{
      if (!ro){
        ro = new ResizeObserver(function(){ schedule(); });
      }
      ro.observe(paper);
      ro.observe(cdn);
    }catch(e){}
  }
  apply(paper, cdn);
}

var pend = null;
function schedule(){
  if (pend) return;
  pend = setTimeout(function(){ pend = null; fix(); }, 120);
}

function start(){
  fix();
  /* Ré-application au re-mont React du drawer (routes SPA, drawer temporaire mobile) */
  try{
    mo = new MutationObserver(schedule);
    mo.observe(D.documentElement, {childList:true, subtree:true});

  }

  function start() {
    if (!D.getElementById('adem12-style')) {
      var st = D.createElement('style');
      st.id = 'adem12-style';
      st.textContent = CSS;
      D.head.appendChild(st);
    }
    mount();
    /* suivi léger : routes SPA + auto-réparation (pattern V11) */
    setInterval(fix, 1500);
  }

  if (D.readyState === 'loading') D.addEventListener('DOMContentLoaded', start);
  else start();
})();

</script>
<script>
/* ADEM_V13 — Nettoyage sidebar : retrait des chemins inter-domaines (D1/D2)
 * DEMANDE UTILISATEUR (08/09/2026) : les blocs de navigation de domaines en tête
 * de la barre latérale ne servent plus depuis le bouton flottant « Domaines »
 * (ADEM V12, présent sur toutes les pages) → les retirer proprement :
 *   - shell partagé D1 (et route D1) : bloc violet « → Domaine 2 — Admin.
 *     Personnel / Gestion administrative » (MuiList mono-item sous la marque)
 *   - D2 (D2Layout) : bloc « Retour Domaine 1 » (MuiList mono-item sous la marque)
 * Les en-têtes de marque (« Admina-RH / Domaine … ») sont CONSERVÉS : ils
 * identifient l'application en cours, ils ne sont pas des chemins de navigation.
 *
 * MÉTHODE 100% RUNTIME — 0 octet des bundles React modifié, aucun nœud déplacé :
 *  1. Scan des .MuiList-root dans .MuiDrawer-paper, masquage du <ul> ENTIER
 *     (item + ses marges) par signature textuelle EXACTE :
 *       · D1 : contient « Domaine 2 — Admin. Personnel » ET « Gestion
 *         administrative » (les deux chaînes → aucun faux positif sur la
 *         marque D2 qui ne porte que la première)
 *       · D2 : texte exact « Retour Domaine 1 »
 *  2. Dédoublonnage des filets : ces listes sont coincées entre DEUX Divider ;
 *     une fois la liste masquée, si le Divider précédent (visible) et le
 *     Divider suivant deviennent adjacents, le suivant est masqué aussi
 *     (pas de double hairline entre la marque et la navigation).
 *  3. Persistance SPA : MutationObserver (re-monts React au changement de
 *     route) + filet de sécurité interval 1500 ms — mêmes patterns que V10/V12.
 *
 * NON-INTERFÉRENCE : #adem12-btn/#adem12-panel (V12) vivent hors du paper ;
 * #admina-cdn (bloc tiers, déjà display:none par V12) n'est pas un MuiList ;
 * les listes de navigation métier (sections Su / Z) ne matchent aucune
 * signature. Idempotent, sans restauration (retrait définitif demandé).
 * API : window.__ADEM_V13__ = {version, fix, _applied}
 */
(function () {
  'use strict';
  if (window.__ADEM_V13__) return;
  var D = document;
  var API = window.__ADEM_V13__ = { version: 'V13', fix: fix, _applied: 0 };

  /* signatures — em dash U+2014 exact, espaces normalisés à la comparaison */
  var SIG_D1_A = 'Domaine 2 — Admin. Personnel';
  var SIG_D1_B = 'Gestion administrative';
  var SIG_D2 = 'Retour Domaine 1';

  function norm(s) { return (s || '').replace(/\s+/g, ' ').trim(); }

  function isDivider(el) {
    return !!el && (el.tagName === 'HR' ||
      (el.classList && el.classList.contains('MuiDivider-root')));
  }

  function prevVisible(el) {
    var p = el.previousElementSibling;
    while (p) {
      if (getComputedStyle(p).display !== 'none') return p;
      p = p.previousElementSibling;
    }
    return null;
  }

  function matchSignature(txt) {
    var t = norm(txt);
    if (t.indexOf(SIG_D1_A) !== -1 && t.indexOf(SIG_D1_B) !== -1) return true; /* bloc D1 (et seul porteur des 2 chaînes) */
    return t === SIG_D2; /* bloc D2 : texte strictement égal */
  }

  function fix() {
    var papers = D.querySelectorAll('.MuiDrawer-paper');
    for (var i = 0; i < papers.length; i++) {
      var lists = papers[i].querySelectorAll('.MuiList-root');
      for (var j = 0; j < lists.length; j++) {
        var ul = lists[j];
        if (ul.style.display === 'none') continue;           /* déjà traité */
        if (!matchSignature(ul.textContent)) continue;
        ul.style.display = 'none';
        ul.setAttribute('data-adem13', 'hidden');
        API._applied++;
        /* dédoublonnage : Divider précédent visible + Divider suivant → masquer le suivant */
        var prev = prevVisible(ul), next = ul.nextElementSibling;
        if (isDivider(prev) && isDivider(next) &&
            getComputedStyle(next).display !== 'none') {
          next.style.display = 'none';
          next.setAttribute('data-adem13', 'hidden-divider');
        }
      }
    }
  }

  function start() {
    fix();
    try {
      var mo = new MutationObserver(function () { fix(); });
      mo.observe(D.documentElement, { childList: true, subtree: true });
    } catch (e) {}
    setInterval(fix, 1500); /* filet de sécurité (patterns V10/V12) */
  }

  if (D.readyState === 'loading') D.addEventListener('DOMContentLoaded', start);
  else start();
})();

</script>
